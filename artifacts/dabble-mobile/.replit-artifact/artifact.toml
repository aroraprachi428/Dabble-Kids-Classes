kind = "mobile"
previewPath = "/mobile/"
title = "Dabble Mobile"
description = "The native mobile experience for Bangalore parents to discover vetted kids coaches and classes, choose a trial slot, and complete a booking."
version = "1.0.0"
id = "artifacts/dabble-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 19466

[services.development]
run = "pnpm --filter @workspace/dabble-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dabble-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dabble-mobile", "run", "serve" ]

[services.env]
PORT = "19466"
BASE_PATH = "/mobile/"
