openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: coaches
    description: Coach discovery
  - name: bookings
    description: Trial bookings
  - name: recommendations
    description: AI-assisted class recommendations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /coaches:
    get:
      operationId: listCoaches
      tags: [coaches]
      summary: Find vetted coaches
      description: Returns coaches ranked against a simple parsed search intent.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: activity
          in: query
          required: false
          schema:
            type: string
        - name: location
          in: query
          required: false
          schema:
            type: string
        - name: age
          in: query
          required: false
          schema:
            type: integer
        - name: day
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching coaches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coach"
  /coaches/{coachId}:
    get:
      operationId: getCoach
      tags: [coaches]
      summary: Get coach details
      parameters:
        - name: coachId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Coach details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coach"
        "404":
          description: Coach not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Book a trial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Trial booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /order:
    post:
      operationId: createPaymentOrder
      tags: [bookings]
      summary: Create a payment order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentOrderInput"
      responses:
        "200":
          description: Payment order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "400":
          description: Invalid payment order request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Payment provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /verify:
    post:
      operationId: verifyPayment
      tags: [bookings]
      summary: Verify a payment and create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentInput"
      responses:
        "201":
          description: Booking created after payment verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid payment or booking request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bookings/{bookingId}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking confirmation
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /recommend:
    post:
      operationId: recommendClasses
      tags: [recommendations]
      summary: Recommend classes from a natural-language request
      description: Returns parsed parent intent and ranked catalog class ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationInput"
      responses:
        "200":
          description: Ranked recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "400":
          description: Invalid recommendation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Coach:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        activity:
          type: string
        venue:
          type: string
        area:
          type: string
        distance:
          type: string
        rating:
          type: number
        reviews:
          type: integer
        price:
          type: integer
        priceLabel:
          type: string
        ageRange:
          type: string
        experience:
          type: string
        description:
          type: string
        verified:
          type: boolean
        trialAvailable:
          type: boolean
        imageUrl:
          type: string
        accent:
          type: string
        highlights:
          type: array
          items:
            type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/TrialSlot"
        sessionFormats:
          type: array
          items:
            type: string
        venueType:
          type: string
        serviceAreas:
          type: array
          items:
            type: string
        ageMin:
          type: integer
        ageMax:
          type: integer
        parentAccompanied:
          type: boolean
      required:
        - id
        - name
        - activity
        - venue
        - area
        - distance
        - rating
        - reviews
        - price
        - priceLabel
        - ageRange
        - experience
        - description
        - verified
        - trialAvailable
        - imageUrl
        - accent
        - highlights
        - slots
        - sessionFormats
        - venueType
        - serviceAreas
        - ageMin
        - ageMax
        - parentAccompanied
    TrialSlot:
      type: object
      properties:
        id:
          type: string
        day:
          type: string
        date:
          type: string
        time:
          type: string
        label:
          type: string
      required:
        - id
        - day
        - date
        - time
        - label
    BookingInput:
      type: object
      properties:
        coachId:
          type: string
        slotId:
          type: string
        childName:
          type: string
        childAge:
          type: integer
          minimum: 4
          maximum: 18
        parentName:
          type: string
        parentEmail:
          type: string
        parentPhone:
          type: string
        seats:
          type: integer
          minimum: 1
          maximum: 10
      required:
        - coachId
        - slotId
        - childName
        - childAge
        - parentName
        - parentEmail
        - parentPhone
    PaymentOrderInput:
      type: object
      properties:
        coachId:
          type: string
          minLength: 1
        slotId:
          type: string
          minLength: 1
        seats:
          type: integer
          minimum: 1
          maximum: 10
      required:
        - coachId
        - slotId
        - seats
    PaymentOrder:
      type: object
      properties:
        mode:
          type: string
          enum: [razorpay, simulated]
        orderId:
          type: string
        keyId:
          type: string
        amount:
          type: integer
        amountPaise:
          type: integer
        currency:
          type: string
          enum: [INR]
        coachFee:
          type: integer
        dabbleFee:
          type: integer
        total:
          type: integer
        seats:
          type: integer
          minimum: 1
          maximum: 10
      required:
        - mode
        - orderId
        - keyId
        - amount
        - amountPaise
        - currency
        - coachFee
        - dabbleFee
        - total
        - seats
    VerifyPaymentInput:
      allOf:
        - $ref: "#/components/schemas/BookingInput"
        - type: object
          properties:
            orderId:
              type: string
              minLength: 1
            paymentId:
              type: string
            signature:
              type: string
          required:
            - orderId
            - seats
    Booking:
      allOf:
        - $ref: "#/components/schemas/BookingInput"
        - type: object
          properties:
            id:
              type: string
            coach:
              $ref: "#/components/schemas/Coach"
            slot:
              $ref: "#/components/schemas/TrialSlot"
            trialFee:
              type: integer
            serviceFee:
              type: integer
            coachFee:
              type: integer
            dabbleFee:
              type: integer
            seats:
              type: integer
              minimum: 1
              maximum: 10
            total:
              type: integer
            createdAt:
              type: string
          required:
            - id
            - coach
            - slot
            - trialFee
            - serviceFee
             - coachFee
             - dabbleFee
             - seats
            - total
            - createdAt
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    RecommendationInput:
      type: object
      properties:
        query:
          type: string
          minLength: 1
      required:
        - query
    RecommendationIntent:
      type: object
      properties:
        activity:
          type: string
        childAge:
          type: ["integer", "null"]
        level:
          type: string
        area:
          type: string
        day:
          type: string
        timeOfDay:
          type: string
        maxPrice:
          type: ["integer", "null"]
        society:
          type: string
        formatPreference:
          type: string
        venuePreference:
          type: string
        ageNote:
          type: string
      required:
        - activity
        - childAge
        - level
        - area
        - day
        - timeOfDay
        - maxPrice
        - society
        - formatPreference
        - venuePreference
        - ageNote
    RecommendationResult:
      type: object
      properties:
        id:
          type: string
        matchScore:
          type: integer
          minimum: 0
          maximum: 100
        reason:
          type: string
      required:
        - id
        - matchScore
        - reason
    RecommendationResponse:
      type: object
      properties:
        intent:
          $ref: "#/components/schemas/RecommendationIntent"
        results:
          type: array
          minItems: 0
          maxItems: 8
          items:
            $ref: "#/components/schemas/RecommendationResult"
      required:
        - intent
        - results

